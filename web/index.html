<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CG Arena</title>
<style>
  :root { --bg: #0f1420; --panel: #161c2b; --border: #26304a; --text: #d9e0ee; --muted: #8a94ab; --accent: #f2b134; --p0: #ff8a3d; --p1: #4fa3ff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, Segoe UI, sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header .brand { font-weight: 700; color: var(--accent); margin-right: 8px; letter-spacing: .5px; }
  header label { color: var(--muted); font-size: 12px; display: flex; flex-direction: column; gap: 2px; }
  select, input[type=number] { background: #0b0f1a; color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; font-size: 13px; }
  input[type=number] { width: 72px; }
  button { background: var(--accent); color: #111; border: 0; border-radius: 4px; padding: 7px 14px; font-weight: 700; cursor: pointer; }
  button.secondary { background: #2a3350; color: var(--text); font-weight: 500; }
  button:disabled { opacity: .5; cursor: default; }
  main { display: grid; grid-template-columns: 300px 1fr 520px; height: calc(100% - 54px); }
  @media (max-width: 1300px) { main { grid-template-columns: 260px 1fr 420px; } }
  aside { border-right: 1px solid var(--border); overflow: auto; padding: 14px; font-size: 13px; }
  aside h1 { font-size: 18px; margin: 0 0 8px; } aside h2 { font-size: 14px; margin: 16px 0 6px; color: var(--accent); }
  aside table { border-collapse: collapse; font-size: 12px; } aside td, aside th { border: 1px solid var(--border); padding: 3px 5px; text-align: left; vertical-align: top; }
  aside code { background: #0b0f1a; padding: 1px 4px; border-radius: 3px; font-size: 12px; }
  #editor { position: relative; min-width: 0; }
  #editor .monaco, #fallback { position: absolute; inset: 0; }
  #fallback { width: 100%; height: 100%; background: #0b0f1a; color: var(--text); border: 0; padding: 10px; font: 13px/1.4 Consolas, monospace; resize: none; display: none; }
  #right { border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  #viewer { width: 100%; aspect-ratio: 3 / 2; background: #0b0f1a; display: block; }
  #hud { padding: 6px 10px; font: 12px/1.5 Consolas, monospace; color: var(--muted); white-space: pre-wrap; border-bottom: 1px solid var(--border); min-height: 54px; }
  #hud .p0 { color: var(--p0); } #hud .p1 { color: var(--p1); }
  .controls { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  .controls input[type=range] { flex: 1; }
  .controls .turn { color: var(--muted); font-size: 12px; min-width: 90px; text-align: right; }
  #result { padding: 6px 10px; font-weight: 600; border-bottom: 1px solid var(--border); min-height: 32px; }
  #result.win { color: #6fe08a; } #result.lose { color: #ff6a6a; } #result.draw { color: var(--accent); }
  .tabs { display: flex; gap: 2px; padding: 4px 8px 0; border-bottom: 1px solid var(--border); }
  .tabs button { background: transparent; color: var(--muted); font-weight: 500; padding: 5px 10px; border-radius: 4px 4px 0 0; }
  .tabs button.active { background: #0b0f1a; color: var(--text); }
  #console { flex: 1; margin: 0; overflow: auto; padding: 8px 10px; font: 12px/1.45 Consolas, monospace; white-space: pre-wrap; background: #0b0f1a; }
  #console .err { color: #ff6a6a; } #console .dim { color: var(--muted); } #console .out { color: #6fe08a; }
  .pill { display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 11px; margin-left: 6px; }
  .pill.p0 { background: var(--p0); color: #111; } .pill.p1 { background: var(--p1); color: #111; }
</style>
</head>
<body>
<header>
  <span class="brand">CG ARENA</span>
  <label>Game <select id="game"></select></label>
  <label>Language <select id="lang"></select></label>
  <label>Player 0 <span class="pill p0" style="margin:0">P0</span> <select id="p0"></select></label>
  <label>Player 1 <span class="pill p1" style="margin:0">P1</span> <select id="p1"></select></label>
  <label id="leagueLabel" style="display:none">League <select id="league"></select></label>
  <label title="Any integer. CodinGame seeds (from a replay's options) reproduce the same map">Seed <input id="seed" type="text" inputmode="numeric" value="1" style="width:110px"></label>
  <label title="Multiply the per-turn time limit (useful while debugging)">Time ×<input id="tmult" type="number" value="1" min="0.1" step="0.5"></label>
  <button id="run" title="Ctrl+Enter">▶ Play</button>
  <button id="stop" class="secondary" disabled>Stop</button>
  <button id="reset" class="secondary" title="Reload the starter code for this game/language">Reset code</button>
  <span id="status" style="color:var(--muted);font-size:12px"></span>
</header>
<main>
  <aside id="statement"></aside>
  <section id="editor"><div class="monaco" id="monaco"></div><textarea id="fallback" spellcheck="false"></textarea></section>
  <section id="right">
    <canvas id="viewer"></canvas>
    <div id="hud"></div>
    <div class="controls">
      <button class="secondary" id="first">⏮</button>
      <button class="secondary" id="prev">◀</button>
      <button class="secondary" id="play">▶</button>
      <button class="secondary" id="next">▶|</button>
      <input type="range" id="slider" min="0" max="0" value="0">
      <span class="turn" id="turn">turn 0 / 0</span>
      <select id="speed"><option value="600">slow</option><option value="250" selected>normal</option><option value="80">fast</option><option value="20">turbo</option></select>
    </div>
    <div id="result"></div>
    <div class="tabs">
      <button class="active" data-tab="console0">Console P0</button>
      <button data-tab="console1">Console P1</button>
      <button data-tab="io">Input / Output</button>
      <button data-tab="log">Game log</button>
    </div>
    <pre id="console"></pre>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.50.0/min/vs/loader.min.js"></script>
<script src="app.js"></script>
</body>
</html>
